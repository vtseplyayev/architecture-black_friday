services:
  mongodb1:
    container_name: mongodb1
    image: docker.io/library/mongo:latest # изменено на официальный репо, с gitverse практически не грузит (или останавливается на 40-50 мб и ошибка)
    volumes:
      - mongodb1_data_container:/data/db

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongodb1
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongodb1"
      MONGODB_DATABASE_NAME: "somedb"


volumes:
  mongodb1_data_container:
