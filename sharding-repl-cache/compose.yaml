name: sharding-repl-cache

services:
  # Роутер запросов — единственная точка входа для приложения
  mongos_router:
    container_name: mongos_router
    image: docker.io/library/mongo:latest
    command: mongos --configdb config_server/configSrv:27017 --bind_ip_all --port 27017
    ports:
      - 27017:27017
    depends_on:
      - configSrv
      - shard1-1
      - shard1-2
      - shard1-3
      - shard2-1
      - shard2-2
      - shard2-3

  # Конфигурационный сервер — хранит метаданные кластера
  configSrv:
    container_name: configSrv
    image: docker.io/library/mongo:latest
    command: mongod --configsvr --replSet config_server --bind_ip_all --port 27017 --dbpath /data/db
    volumes:
      - configSrv_data:/data/db

  # ---- Группа репликации shard1 (replSet shard1, 3 узла) ----
  shard1-1:
    container_name: shard1-1
    image: docker.io/library/mongo:latest
    command: mongod --shardsvr --replSet shard1 --bind_ip_all --port 27018 --dbpath /data/db
    volumes:
      - shard1_1_data:/data/db

  shard1-2:
    container_name: shard1-2
    image: docker.io/library/mongo:latest
    command: mongod --shardsvr --replSet shard1 --bind_ip_all --port 27018 --dbpath /data/db
    volumes:
      - shard1_2_data:/data/db

  shard1-3:
    container_name: shard1-3
    image: docker.io/library/mongo:latest
    command: mongod --shardsvr --replSet shard1 --bind_ip_all --port 27018 --dbpath /data/db
    volumes:
      - shard1_3_data:/data/db

  # ---- Группа репликации shard2 (replSet shard2, 3 узла) ----
  shard2-1:
    container_name: shard2-1
    image: docker.io/library/mongo:latest
    command: mongod --shardsvr --replSet shard2 --bind_ip_all --port 27018 --dbpath /data/db
    volumes:
      - shard2_1_data:/data/db

  shard2-2:
    container_name: shard2-2
    image: docker.io/library/mongo:latest
    command: mongod --shardsvr --replSet shard2 --bind_ip_all --port 27018 --dbpath /data/db
    volumes:
      - shard2_2_data:/data/db

  shard2-3:
    container_name: shard2-3
    image: docker.io/library/mongo:latest
    command: mongod --shardsvr --replSet shard2 --bind_ip_all --port 27018 --dbpath /data/db
    volumes:
      - shard2_3_data:/data/db

  # Приложение — подключается только к роутеру mongos
  # Кеш — Redis для кеширования запросов приложения к MongoDB
  redis:
    container_name: redis
    image: docker.io/library/redis:latest
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

  # Приложение — подключается к роутеру mongos и к Redis (кеш)
  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
      - redis
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27017"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis:6379"

volumes:
  configSrv_data:
  redis_data:
  shard1_1_data:
  shard1_2_data:
  shard1_3_data:
  shard2_1_data:
  shard2_2_data:
  shard2_3_data:
